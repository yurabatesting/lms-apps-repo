server {
    listen 80;
    server_name localhost;

    # 1. Rute SPA Utama (Dashboard, Login, & Papan Skor)
    location / {
        proxy_pass http://fe-main:80/;
        proxy_set_header Host $host;
    }

    # 2. Rute Halaman Ujian (Micro-frontend terpisah)
    location /assessment/ {
        proxy_pass http://fe-assessment:80/;
        proxy_set_header Host $host;
    }

    # 3. Rute Komunikasi Data ke API Gateway Backend
    location /api/ {
        proxy_pass http://lms-api-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}