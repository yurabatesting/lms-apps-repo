server {
    listen 80;
    server_name localhost;

    # 1. Rute Halaman Utama (Materi & Login)
    location / {
        proxy_pass http://fe-main:80/;
        proxy_set_header Host $host;
    }

    # # 2. Rute Halaman Peringkat
    # location /rangking/ {
    #     proxy_pass http://fe-rangking:80/;
    #     proxy_set_header Host $host;
    # }

    # # 3. Rute Halaman Ujian
    # location /assessment/ {
    #     proxy_pass http://fe-assessment:80/;
    #     proxy_set_header Host $host;
    # }

    # 4. Rute Komunikasi Data ke API Gateway Backend
    location /api/ {
        proxy_pass http://lms-api-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}