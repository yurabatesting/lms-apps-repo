server {
    listen 80;
    server_name localhost;

    # ==========================================
    # SECURITY HARDENING (Langkah 2)
    # ==========================================
    
    # 1. Sembunyikan versi Nginx dari peramban dan halaman error
    server_tokens off;

    # 2. Injeksi Header Keamanan (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Catatan: HSTS biasanya ditambahkan di sini, tapi karena terminasi HTTPS
    # akan diurus oleh Cloud Load Balancer GCP, kita serahkan konfigurasi HSTS ke GCP nantinya.

    # TAMBAHAN BARU: Content Security Policy (CSP)
    # Hanya izinkan script, gambar, dan koneksi dari domain aplikasi ini sendiri
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';" always;

    # ==========================================
    # CAPACITY & RELIABILITY (Langkah 3)
    # ==========================================
    # 1. Batas maksimal ukuran payload (misal untuk upload PDF materi)
    client_max_body_size 20M;


    # ==========================================
    # PERFORMANCE / GZIP COMPRESSION (Langkah 4)
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/javascript 
        application/x-javascript 
        application/json 
        application/xml;
    gzip_disable "MSIE [1-6]\.";

    # ==========================================
    # ROUTING
    # ==========================================

    # 1. Rute SPA Utama (Dashboard, Login, & Papan Skor)
    location / {
        proxy_pass http://fe-main:80/;
        proxy_set_header Host $host;
    }

    # 2. Rute Halaman Ujian (Micro-frontend terpisah)
    location /assessment/ {
        proxy_pass http://fe-assessment:80/;
        proxy_set_header Host $host;
    }

    # 3. Rute Komunikasi Data ke API Gateway Backend
    location /api/ {
        proxy_pass http://lms-api-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}