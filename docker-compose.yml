version: '3.8'

services:
  # 1. PostgreSQL untuk Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: lms-postgres
    environment:
      POSTGRES_USER: lms_admin
      POSTGRES_PASSWORD: secretpassword
      # Saat container pertama kali dibuat, ia akan mengeksekusi file di dalam docker-entrypoint-initdb.d
    ports:
      - "5432:5432" # Mapping port Macbook (kiri) ke port Container (kanan)
    volumes:
      - pgdata:/var/lib/postgresql/data # Agar data tidak hilang saat container mati (Persistence)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # Menyuntikkan script init.sql
    restart: unless-stopped

  # 2. Redis untuk In-Memory Cache & Leaderboard
  redis:
    image: redis:7-alpine
    container_name: lms-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # --- TAMBAHAN BARU: Auth Service ---
  auth-service:
    build: 
      context: ./auth-service # Docker akan nge-build dari folder ini
    container_name: lms-auth-service
    ports:
      - "8000" # Port FastAPI
    environment:
      # Variabel untuk koneksi database
      - DATABASE_URL=${AUTH_DB_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - FIRST_ADMIN_USER=${FIRST_ADMIN_USER} # <-- TAMBAHKAN INI
      - FIRST_ADMIN_PASS=${FIRST_ADMIN_PASS} # <-- TAMBAHKAN INI
      - ENVIRONMENT=${ENVIRONMENT} # <-- TAMBAHKAN INI
    depends_on:
      - postgres # Tunggu database nyala dulu sebelum Auth Service jalan
    restart: unless-stopped

  # --- TAMBAHAN BARU: Content Service ---
  content-service:
    build:
      context: ./content-service
    container_name: lms-content-service
    ports:
      - "8001" # Service ini jalan di port 8001 MacBook Anda
    environment:
      # Terhubung ke content_db
      - DATABASE_URL=${CONTENT_DB_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT}
      - STORAGE_MODE=${STORAGE_MODE}
    depends_on:
      - postgres
    volumes: # <--- TAMBAHKAN BLOK INI
      - ./uploads:/app/uploads
    restart: unless-stopped

  # --- TAMBAHAN BARU: API Gateway ---
  api-gateway:
    build:
      context: ./api-gateway
    container_name: lms-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - content-service
    restart: unless-stopped

  # --- TAMBAHAN BARU: Assessment Service ---
  assessment-service:
    build:
      context: ./assessment-service
    container_name: lms-assessment-service
    environment:
      - DATABASE_URL=${ASSESSMENT_DB_URL} 
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT}
    expose:
      - "8002"
    restart: unless-stopped

  # --- TAMBAHAN BARU: Leaderboard Service ---
  leaderboard-service:
    build:
      context: ./leaderboard-service
    container_name: lms-leaderboard-service
    environment:
      # Variabel ini mengarahkan koneksi ke nama container Redis Anda
      - REDIS_HOST=lms-redis
      - REDIS_PORT=6379
      - SECRET_KEY=super_secret_key_lms
    expose:
      - "8003"
    depends_on:
      - redis
    restart: unless-stopped


  # --- TAMBAHAN BARU: NGINX Router ---
  nginx-router:
    build: ./nginx-router
    container_name: lms-nginx-router
    ports:
      - "80:80"
    depends_on:
      - fe-main
      - api-gateway
    restart: unless-stopped

  # --- TAMBAHAN BARU: FE Main ---
  fe-main:
    build:
      context: ./fe-main
    container_name: lms-fe-main
    expose:
      - "80" # Port disembunyikan, hanya melayani nginx-router
    restart: unless-stopped

  # --- TAMBAHAN BARU: FE Assessment ---
  fe-assessment:
      build:
        context: ./fe-assessment
      container_name: lms-fe-assessment
      restart: unless-stopped






# Mendefinisikan nama volume untuk menyimpan data secara permanen
volumes:
  pgdata:
  redisdata: